[project]
name = "farsounder"
version = "0.1.0"
description = "Python client for FarSounder's protobuf over ZeroMQ API"
readme = "README.md"
authors = [
    { name = "FarSounder", email = "sw@farsounder.com" }
]
requires-python = ">=3.13"
dependencies = [
    "protobuf",
    "pyzmq",
]

[project.scripts]
gen-protos = "farsounder.tools.gen_protos:main"

[dependency-groups]
dev = [
    "grpcio-tools",
    "pytest",
    "ruff>=0.14.14",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
